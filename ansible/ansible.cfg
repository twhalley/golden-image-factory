[defaults]
roles_path         = roles
inventory          = inventory
host_key_checking  = False
retry_files_enabled = False
# NOT `stdout_callback = yaml`. That was community.general's callback and it was
# REMOVED in community.general 12.0.0, superseded by a core option. With the
# pinned 13.3.0 in requirements.yml it fails the build outright:
#   [ERROR]: The 'community.general.yaml' callback plugin has been removed.
# The core equivalent below produces the same readable output.
stdout_callback    = default
result_format      = yaml
bin_ansible_callbacks = True
interpreter_python = auto_silent
forks              = 10

# Ansible runs against a machine that exists for minutes. Fact caching would be
# cache invalidation for no benefit.
gathering = smart

[ssh_connection]
# Packer's builders hand Ansible a fresh host every run, so there is no known
# host to check and no persistent connection worth keeping warm beyond the build.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
