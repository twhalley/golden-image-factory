---
# Shift-left gate 2 of 3: the pull request.
# Catches what a developer bypassed locally (`git commit --no-verify`) and what a
# machine without the hooks installed pushed. See docs/SHIFT-LEFT.md.
name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Deny by default at workflow level; each job grants only what it needs.
permissions: {}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  CHECKOV_VERSION: "3.3.11"
  PACKER_VERSION: "1.16.0"
  CONFTEST_VERSION: "0.69.0"
  CONFTEST_SHA256: "96fc2fbf11f0afde51256647127e6f00a64ce839a4d9a0a1aef2426c0e6f4b3f"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gitleaks scans history, not just the diff — a secret committed and
          # then "removed" in a later commit is still a leaked secret.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository history
        run: gitleaks git --redact --verbose --exit-code 1 .

      - name: Scan working tree
        # Belt and braces: `gitleaks git` walks commits, `gitleaks dir` walks files
        # as they are on disk, which catches an untracked-but-present secret in a
        # future workflow that writes files before scanning.
        run: gitleaks dir --redact --verbose --exit-code 1 .

  iac:
    name: checkov
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install checkov (version-pinned)
        # NOT bridgecrewio/checkov-action: that action runs an internal container
        # image of checkov 2.0.930 (2021), which predates the `ansible` framework
        # and rejects the framework list outright. See ADR-0008.
        #
        # Residual gap, stated rather than hidden: this is version-pinned but not
        # hash-pinned, so it trusts PyPI and checkov's transitive dependency tree.
        # Recorded in docs/THREATMODEL.md.
        run: pip install --disable-pip-version-check "checkov==${CHECKOV_VERSION}"

      - name: Checkov
        run: |
          checkov --directory . \
                  --framework terraform github_actions ansible dockerfile secrets \
                  --download-external-modules false \
                  --compact --quiet \
                  --output cli

  # Packer HCL is NOT covered by checkov in any meaningful way. This job is the
  # honest substitute, not an equivalent. See the "Known gap" section of
  # docs/SHIFT-LEFT.md before assuming Packer templates are scanned.
  packer-policy:
    name: packer fmt + opa policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Packer and conftest (pinned)
        run: |
          set -euo pipefail
          base="https://releases.hashicorp.com/packer/${PACKER_VERSION}"
          curl -fsSL -o packer.zip "${base}/packer_${PACKER_VERSION}_linux_amd64.zip"
          curl -fsSL -o sums.txt "${base}/packer_${PACKER_VERSION}_SHA256SUMS"
          grep "linux_amd64.zip" sums.txt \
            | sed "s|packer_${PACKER_VERSION}_linux_amd64.zip|packer.zip|" \
            | sha256sum -c -
          unzip -q packer.zip && install -m 0755 packer /usr/local/bin/packer

          curl -fsSL -o conftest.tgz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  conftest.tgz" | sha256sum -c -
          tar xzf conftest.tgz conftest && install -m 0755 conftest /usr/local/bin/conftest

          packer version && conftest --version

      - name: packer fmt -check
        run: packer fmt -check -diff -recursive packer/

      # Every source, including the two that are not executed anywhere yet.
      # A vsphere-iso block nobody builds is exactly the block that rots, so it
      # is validated on every PR against dummy credentials.
      - name: packer init and validate (all four sources)
        env:
          # Structurally valid but useless — enough to satisfy variable
          # validation without authenticating to anything.
          PKR_VAR_ssh_public_key: >-
            ssh-ed25519
            AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            ci-validate-only
          PKR_VAR_ssh_private_key_file: "/dev/null"
        run: |
          set -euo pipefail
          packer init packer/linux
          packer validate -var-file=packer/linux/rocky9.pkrvars.hcl packer/linux

      # The honest substitute for the Packer IaC scanning that does not exist.
      # Read policy/packer.rego before treating this as equivalent to checkov's
      # Terraform coverage — it is not, and ADR-0005 says why.
      - name: conftest — Packer policy
        run: conftest test --parser hcl2 --policy policy packer/linux/*.pkr.hcl
