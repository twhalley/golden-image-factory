---
# Shift-left gate 2 of 3: the pull request.
# Catches what a developer bypassed locally (`git commit --no-verify`) and what a
# machine without the hooks installed pushed. See docs/SHIFT-LEFT.md.
name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Deny by default at workflow level; each job grants only what it needs.
permissions: {}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gitleaks scans history, not just the diff — a secret committed and
          # then "removed" in a later commit is still a leaked secret.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository history
        run: gitleaks git --redact --verbose --exit-code 1 .

      - name: Scan working tree
        # Belt and braces: `gitleaks git` walks commits, `gitleaks dir` walks files
        # as they are on disk, which catches an untracked-but-present secret in a
        # future workflow that writes files before scanning.
        run: gitleaks dir --redact --verbose --exit-code 1 .

  iac:
    name: checkov
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf  # v12.1347.0
        with:
          directory: .
          framework: terraform,github_actions,ansible,dockerfile,secrets
          quiet: true
          soft_fail: false
          output_format: cli
          download_external_modules: false

  # Packer HCL is NOT covered by checkov in any meaningful way. This job is the
  # honest substitute, not an equivalent. See the "Known gap" section of
  # docs/SHIFT-LEFT.md before assuming Packer templates are scanned.
  packer-policy:
    name: packer fmt + opa policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Skip if no Packer templates yet
        id: guard
        run: |
          set -euo pipefail
          if compgen -G "packer/**/*.pkr.hcl" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Packer templates present yet (phase 0). Nothing to check."
          fi
        shell: bash

      - name: Install Packer (pinned)
        if: steps.guard.outputs.present == 'true'
        run: |
          set -euo pipefail
          ver=1.16.0
          curl -fsSL -o packer.zip "https://releases.hashicorp.com/packer/${ver}/packer_${ver}_linux_amd64.zip"
          curl -fsSL -o sums.txt "https://releases.hashicorp.com/packer/${ver}/packer_${ver}_SHA256SUMS"
          grep "linux_amd64.zip" sums.txt | sed "s|packer_${ver}_linux_amd64.zip|packer.zip|" | sha256sum -c -
          unzip -q packer.zip && install -m 0755 packer /usr/local/bin/packer
          packer version

      - name: packer fmt -check
        if: steps.guard.outputs.present == 'true'
        run: packer fmt -check -diff -recursive packer/
